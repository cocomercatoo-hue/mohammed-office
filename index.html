<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إمبراطورية موسى - مكتب الذكاء الاصطناعي</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-color: #10b981;
            --text-color: #f3f4f6;
            --border-color: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }

        .office-header {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .office-header h2 { margin: 0; color: var(--accent-color); font-size: 1.1rem; }
        .stats-box { background: #065f46; color: #fff; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 1rem;
        }

        .btn:active { opacity: 0.8; }

        .design-box {
            background: #1f2937;
            border: 2px dashed var(--accent-color);
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: right;
        }

        .design-title { font-size: 1.1rem; font-weight: bold; color: #34d399; }
        .info-text { font-size: 0.85rem; color: #9ca3af; margin-top: 5px; }
        
        .tags-box {
            background: #0f172a;
            padding: 8px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.75rem;
            color: #38bdf8;
            margin-top: 5px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="office-header">
        <div>
            <h2>🏢 مكتب المدير موسى</h2>
            <small style="color: #9ca3af;">عمال الذكاء الاصطناعي في الخدمة</small>
        </div>
        <div class="stats-box">📊 المشاريع المنشورة: <span id="pubCount">0</span></div>
    </div>

    <!-- لوحة التحكم -->
    <div class="card">
        <h3>🤖 فريق العمل (الذكاء الاصطناعي)</h3>
        <p style="font-size: 0.85rem; color: #9ca3af;">اضغط هنا باش العمال يصوبوا ليك تصميم جديد ويحطوه في مكتبك:</p>
        <button class="btn" onclick="generateProject()">طلب تصميم جديد من العمال ⚡</button>
    </div>

    <!-- صندوق الوارد -->
    <h3>📁 صندوق مراجعة المشاريع (أنت من تحكم في النشر)</h3>
    <div id="officeInbox">
        <p style="text-align: center; color: #6b7280; padding: 20px;">المكتب فارغ حالياً. اطلب من العمال تصميم مشروع جديد!</p>
    </div>

    <script>
        let pubCount = localStorage.getItem('mousa_projects') ? parseInt(localStorage.getItem('mousa_projects')) : 0;
        document.getElementById('pubCount').innerText = pubCount;

        const projectsDatabase = [
            { title: "Coffee Is My Therapy", tags: "coffee lover, funny coffee quote, cute coffee cup, caffeine addict", desc: "تصميم خاص بعشاق القهوة، مطلوب بكثرة على التيشرتات والأكواب." },
            { title: "Code Sleep Repeat", tags: "programmer gift, coder life, developer tee, software engineering", desc: "تصميم عصري مخصص للمبرمجين والتقنيين." },
            { title: "Plant Mom Vibes", tags: "plant lover, botanical, cute plants, nature aesthetic", desc: "تصميم أنيق لعشاق النباتات المنزلية والزهور." },
            { title: "Bookworm Loading...", tags: "reading lover, bookish merch, cute library, reader gift", desc: "تصميم فريد ومحبوب لدى عشاق القراءة والكتب." },
            { title: "Good Vibes Only", tags: "positive energy, aesthetic typography, cute quote, motivational tee", desc: "تصميم تحفيزي إيجابي يناسب التيشرتات والأكواب." }
        ];

        function generateProject() {
            const randomProj = projectsDatabase[Math.floor(Math.random() * projectsDatabase.length)];
            const inbox = document.getElementById('officeInbox');
            
            if(inbox.querySelector('p')) {
                inbox.innerHTML = '';
            }

            const card = document.createElement('div');
            card.className = 'card';
            card.style.border = "2px solid #3b82f6";
            card.innerHTML = `
                <span style="background: #1f2937; color: #60a5fa; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem;">👷‍♂️ العمال أنهوا هذا المشروع</span>
                <div class="design-box">
                    <div class="design-title">🎨 العنوان: "${randomProj.title}"</div>
                    <div class="info-text"><strong>الوصف:</strong> ${randomProj.desc}</div>
                    <div class="info-text" style="margin-top: 8px;"><strong>الكلمات المفتاحية (Tags):</strong></div>
                    <div class="tags-box">${randomProj.tags}</div>
                </div>
                <button class="btn" style="background-color: #2563eb; color: #fff;" onclick="publishProject(this)">🚀 الموافقة والنشر (أنت المتحكم)</button>
            `;

            inbox.prepend(card);
        }

        function publishProject(btn) {
            btn.innerText = "✅ تم النشر بنجاح!";
            btn.style.backgroundColor = "#059669";
            btn.disabled = true;
            
            setTimeout(() => {
                pubCount += 1;
                localStorage.setItem('mousa_projects', pubCount);
                document.getElementById('pubCount').innerText = pubCount;
                alert("ممتاز يا سي موسى! تم تأكيد ونشر المشروع في مكتبك بنجاح 🥳");
            }, 400);
        }
    </script>
</body>
</html>
